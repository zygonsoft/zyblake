<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Contact — ZyBlake</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--cream:#fef9d7;--cream2:#fdf3b8;--ink:#1c1708;--ink2:#3a3210;--muted:#7a6e40;--muted2:#b0a460;--border:rgba(100,88,20,0.12);--accent:#c8960a;--accent2:#e5b020;--white:#fffffe;--green:#18a058;--red:#d93025;--radius:12px;--radius-lg:20px}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
    header{position:sticky;top:0;z-index:100;background:rgba(254,249,215,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    nav{max-width:1160px;margin:0 auto;padding:0 48px;height:64px;display:flex;align-items:center;justify-content:space-between}
    .nav-brand{display:flex;align-items:center;gap:9px;text-decoration:none}
    
    .brand-name{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--ink)}
    .brand-name span{color:var(--accent)}
    .brand-caption{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0.8px;display:block;margin-top:1px}
    .nav-links{display:flex;gap:4px;list-style:none}
    .nav-links a{padding:6px 14px;text-decoration:none;font-size:14px;color:var(--muted);border-radius:8px;transition:all .2s;font-weight:500}
    .nav-links a:hover,.nav-links a.active{color:var(--ink);background:rgba(100,88,20,0.07)}
    .nav-cta{background:var(--ink);color:var(--cream);padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;transition:all .2s}
    .nav-cta:hover{background:var(--ink2);transform:translateY(-1px)}
    @media(max-width:720px){.nav-links{display:none}}

    main{padding:80px 0 96px}
    .inner{max-width:720px;margin:0 auto;padding:0 48px}
    @media(max-width:640px){.inner{padding:0 24px}}
    .kicker{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}

    .page-hero{margin-bottom:40px}
    .page-h1{font-family:'Fraunces',serif;font-size:clamp(32px,4.5vw,50px);font-weight:900;color:var(--ink);letter-spacing:-1.5px;line-height:1.08;margin-bottom:12px}
    .page-lead{font-size:15px;color:var(--muted);line-height:1.8}

    .form-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:44px;box-shadow:0 4px 32px rgba(100,88,20,0.06)}
    .form-label-top{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
    @media(max-width:540px){.form-row{grid-template-columns:1fr}}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
    .req{color:var(--accent)}
    input,textarea,select{width:100%;background:var(--cream);border:1.5px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
    input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,150,10,0.1);background:var(--white)}
    input::placeholder,textarea::placeholder{color:var(--muted2)}
    textarea{height:140px;resize:vertical}
    select{appearance:none;cursor:pointer}
    .submit-btn{width:100%;background:var(--ink);color:var(--cream);border:none;border-radius:999px;padding:15px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;letter-spacing:0.2px}
    .submit-btn:hover:not(:disabled){background:var(--ink2);transform:translateY(-1px)}
    .submit-btn:disabled{opacity:.6;cursor:not-allowed}
    .form-feedback{margin-top:14px;font-size:14px;font-weight:500;display:none;padding:13px 16px;border-radius:var(--radius)}
    .form-feedback.success{display:block;background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0}
    .form-feedback.error{display:block;background:#fef2f2;color:var(--red);border:1px solid #fecaca}

    footer{background:var(--ink);padding:40px 0}
    .footer-inner{max-width:1160px;margin:0 auto;padding:0 48px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
    .footer-brand{display:flex;align-items:center;gap:8px}
    .footer-name{font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--cream)}
    .footer-copy{font-size:13px;color:var(--muted)}
    .footer-links{display:flex;gap:24px}
    .footer-links a{font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s}
    .footer-links a:hover{color:var(--cream)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .fu{animation:fadeUp .65s ease both}.fu1{animation:fadeUp .65s .12s ease both}
  </style>
</head>
<body>
<header>
  <nav>
    <a href="index.html" class="nav-brand"> <div><span class="brand-name">Zy<span>Blake</span></span><span class="brand-caption">Expert Database Management</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <a href="contact.html" class="nav-cta">Get a Quote →</a>
  </nav>
</header>
<main>
  <div class="inner">
    <div class="page-hero fu">
      <div class="kicker">Contact</div>
      <h1 class="page-h1">Let's talk about<br/>your databases</h1>
      <p class="page-lead">Describe your technology stack and goals — Our consultants will get back to you.</p>
    </div>
    <div class="form-card fu1">
      <div class="form-label-top">Send us a message</div>
      <div class="form-row">
        <div><label for="from_name">Full Name <span class="req">*</span></label><input type="text" id="from_name" placeholder="Your full name"/></div>
        <div><label for="company">Company</label><input type="text" id="company" placeholder="Your company"/></div>
      </div>
      <div class="form-row">
        <div><label for="from_email">Email <span class="req">*</span></label><input type="email" id="from_email" placeholder="you@company.com"/></div>
        <div><label for="phone">Phone / WhatsApp</label><input type="tel" id="phone" placeholder="+1 000 000 0000"/></div>
      </div>
      <div class="form-group">
        <label for="db_stack">Your Database Stack</label>
        <input type="text" id="db_stack" placeholder="e.g. Oracle 19c, PostgreSQL 15, MongoDB Atlas..."/>
      </div>
      <div class="form-group">
        <label for="service">What do you need help with?</label>
        <select id="service">
          <option value="">— Select a service —</option>
          <option>24×7 Monitoring &amp; Support</option>
          <option>Performance Tuning</option>
          <option>HA/DR &amp; Cloud Migrations</option>
          <option>Backup &amp; Recovery</option>
          <option>Security &amp; Compliance</option>
          <option>Database Modernization</option>
          <option>Custom / Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="message">Message <span class="req">*</span></label>
        <textarea id="message" placeholder="Tell us about your environment, challenges, or goals..."></textarea>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send Inquiry
      </button>
      <div class="form-feedback" id="formFeedback"></div>
    </div>
  </div>
</main>
<footer>
  <div class="footer-inner">
    <div class="footer-brand"> <span class="footer-name">ZyBlake</span>
    </div>
    <span class="footer-copy">© 2025 ZyBlake. All rights reserved.</span>
    <div class="footer-links"><a href="about.html">About</a><a href="services.html">Services</a><a href="contact.html">Contact</a></div>
  </div>
</footer>
<script>
  const EMAILJS_PUBLIC_KEY  = 'qByP2gS-TFTzo9g12';
  const EMAILJS_SERVICE_ID  = 'service_3ak5ufo';
  const EMAILJS_TEMPLATE_ID = 'template_l705xir';
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
  async function handleSubmit() {
    const btn=document.getElementById('submitBtn'), fb=document.getElementById('formFeedback');
    const name=document.getElementById('from_name').value.trim();
    const email=document.getElementById('from_email').value.trim();
    const msg=document.getElementById('message').value.trim();
    fb.className='form-feedback'; fb.textContent='';
    if(!name||!email||!msg){fb.textContent='Please fill in Name, Email and Message.';fb.classList.add('error');return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){fb.textContent='Please enter a valid email address.';fb.classList.add('error');return}
    btn.disabled=true;
    btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Sending...';
    try{
      await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{from_name:name,from_email:email,company:document.getElementById('company').value.trim(),phone:document.getElementById('phone').value.trim(),db_stack:document.getElementById('db_stack').value.trim(),service:document.getElementById('service').value,message:msg});
      fb.textContent="✓ Message sent! Our consultants will get back to you.";
      fb.classList.add('success');
      ['from_name','company','from_email','phone','db_stack','service','message'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    }catch(e){fb.textContent='Something went wrong. Please email us at info@zyblake.com';fb.classList.add('error')}
    finally{btn.disabled=false;btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send Inquiry'}
  }
</script>
</body>
</html>
